<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trabajo Práctico N°2</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container py-5">
      <div class="card shadow p-4">
        <h1 class="text-center mb-4">ToDo List / Task Manager</h1>
        <form id="taskForm" class="d-flex gap-2 mb-4">
          <input
            type="text"
            id="taskInput"
            class="form-control"
            placeholder="Ingrese una nueva tarea"
          />
          <button type="submit" class="btn btn-primary">Agregar</button>
        </form>
        <div class="d-flex justify-content-center gap-2 mb-3">
          <button
            class="btn btn-outline-secondary filter-btn"
            data-filter="all"
          >
            Todas
          </button>
          <button
            class="btn btn-outline-success filter-btn"
            data-filter="completed"
          >
            Completadas
          </button>
          <button
            class="btn btn-outline-warning filter-btn"
            data-filter="pending"
          >
            Pendientes
          </button>
        </div>
        <input
          type="text"
          id="searchInput"
          class="form-control mb-3"
          placeholder="Buscar tarea..."
        />
        <ul id="taskList" class="list-group"></ul>
      </div>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
